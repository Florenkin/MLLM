; MLLM defaults (UTF-8)
[paths]
; 输出根目录，相对路径基于 config 的父目录
output=output
; 运行日志目录
logDirectory=C:/Project/MLLM/log
; 相机标定图像目录
camera_images=
; 激光关闭图像目录
laser_off=
; 激光开启图像目录
laser_on=
; 重建图像目录
reconstruction=
; 标定 YAML 路径
calibration_file=
; 启动时恢复输入路径
restoreInputPaths=true
; paths/calibration_file
camera_images="paths/laser_off"
